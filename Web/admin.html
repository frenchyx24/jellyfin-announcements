<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nflix Notice</title></head><body>
<div id="NflixNoticeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content"><div class="content-primary"><div class="nn-admin" data-nn-admin><p role="status">Chargement du dashboard…</p></div></div></div>
  <script>
  (function () {
    var view = document.getElementById('NflixNoticeConfigPage');
    var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = ApiClient.getUrl('Plugins/NflixNotice/notice.css'); document.head.appendChild(css);
    var script = document.createElement('script'); script.src = ApiClient.getUrl('Plugins/NflixNotice/admin.js');
    script.onload = function () { window.NflixNoticeAdminMount(view.querySelector('[data-nn-admin]'), ApiClient); };
    script.onerror = function () { view.querySelector('[data-nn-admin]').textContent = 'Impossible de charger le dashboard. Rechargez la page.'; };
    document.head.appendChild(script);
  })();
  </script>
</div>
</body></html>
